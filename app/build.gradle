plugins { id 'com.android.application' }

android {
    enableKotlin = false
    namespace 'com.ytadsskipper.app'
    compileSdk { version = release(37) }

    defaultConfig {
        applicationId 'com.ytadsskipper.app'
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'com.ytadsskipper.app.SmokeInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
